<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greška 404</title>
    <style>
      * {
        padding: 0px;
        margin: 0px;
        border: none;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      a,
      a:link,
      a:visited {
        text-decoration: none;
      }

      a:hover {
        text-decoration: none;
      }

      aside,
      nav,
      footer,
      header,
      section,
      main {
        display: block;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      p {
        font-size: inherit;
        font-weight: inherit;
      }

      img {
        vertical-align: top;
      }

      img,
      svg {
        max-width: 100%;
        height: auto;
      }

      address {
        font-style: normal;
      }

      input,
      textarea,
      button,
      select {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
        background-color: transparent;
      }

      input::-ms-clear {
        display: none;
      }

      textarea {
        resize: vertical;
      }

      button,
      input[type="submit"] {
        display: inline-block;
        box-shadow: none;
        background-color: transparent;
        background: none;
        cursor: pointer;
      }

      button::-moz-focus-inner {
        padding: 0;
        border: 0;
      }

      label {
        cursor: pointer;
      }

      legend {
        display: block;
      }

      input[type="file"] {
        max-width: 100%;
      }

      body {
        background-color: rgb(255, 225, 180);
      }
      img {
        max-width: 150px;
        max-height: 150px;
        margin: 50px 0 20px 0;
        display: flex;
      }
      .parent {
        display: flex;
        justify-content: center;
      }
      .main {
        display: flex;
        max-width: 150px;
      }
      h1 {
        position: absolute;
        margin-top: 300px;
        margin-left: calc(75px - 53.39px / 2);
        font-family: Arial;
        font-size: xx-large;
        font-size: bold;
      }
      p {
        position: absolute;
        margin-top: 350px;
        font-weight: bold;
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="main">
        <img src="OLEElogo.png" />
        <h1>404</h1>
        <p>Ups! Došlo je do greške</p>
      </div>
    </div>
  </body>
</html>
