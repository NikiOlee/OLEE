<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="OLEELogoNews.png" type="image/x-icon" />
    <title>Sve OLEE Vesti</title>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: sans-serif;
        background: #ffbf00;
        padding: 20px;
        margin: 0;
      }
      .card {
        background: white;
        padding: 15px;
        border-radius: 10px;
        margin: 0 auto 15px auto;
        border-left: 5px solid #333;
        box-sizing: border-box;
        width: 100%;
        max-width: 100%;
        min-height: 50px;
      }
      h2 {
        margin: 5px 0;
        color: #ffbf00;
      }
      .date {
        font-size: 11px;
        color: #666;
      }
      .instagram-media {
        max-width: 550px !important;
        width: 100% !important;
        margin: 10px auto !important;
      }
      .back {
        position: fixed;
        right: 25px;
        top: 25px;
        text-decoration: none;
        z-index: 1000;
      }
      .backBtn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: none;
        background: orange;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(132, 0, 255, 0.3);
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .backBtn:hover {
        background: #ffbf00;
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(0, 123, 255, 0.2);
      }
      .backBtn:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <a href="index.html" class="back"
      ><button class="backBtn">← Nazad</button></a
    >
    <h1>Arhiva svih vesti</h1>
    <div id="list">Učitavanje...</div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        getDocs,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const config = {
        apiKey: "AIzaSyAwkpFwUaI9ODiH39WzEcpnRxODTVRWCbk",
        authDomain: "olee-news.firebaseapp.com",
        projectId: "olee-news",
        storageBucket: "olee-news.firebasestorage.app",
        messagingSenderId: "983990542162",
        appId: "1:983990542162:web:7c506b4a89c51d2c85248b",
        measurementId: "G-DRE0VYDCYT",
      };

      const app = initializeApp(config);
      const db = getFirestore(app);

      async function load() {
        const list = document.getElementById("list");
        try {
          const snap = await getDocs(collection(db, "news"));
          list.innerHTML = "";
          if (snap.empty) {
            list.innerHTML = "Nema vesti.";
            return;
          }

          let items = [];
          snap.forEach((doc) => items.push(doc.data()));
          items.sort((a, b) => a.date - b.date);

          items.forEach((i, index) => {
            const d = new Date(i.date).toLocaleDateString("sr-RS");
            const div = document.createElement("div");
            div.className = "card";
            if (index === items.length - 1) div.id = "new";

            const videoContent = i.videoHtml
              ? `<div class="video-container" style="margin-top:10px;">${i.videoHtml}</div>`
              : "";
            div.innerHTML = `<div class="date">${d}</div><h2>${i.title}</h2><p>${i.text}</p>${videoContent}`;
            list.appendChild(div);
          });

          if (window.instgrm) {
            window.instgrm.Embeds.process();
          }

          const jumpToNew = (behavior) => {
            const newPost = document.getElementById("new");
            if (newPost) {
              newPost.scrollIntoView({ behavior: behavior, block: "start" });
            }
          };

          jumpToNew("auto");

          let checks = 0;
          const interval = setInterval(() => {
            jumpToNew("smooth");
            checks++;
            if (checks > 6) clearInterval(interval);
          }, 500);
        } catch (e) {
          list.innerHTML = "Greška.";
        }
      }
      load();
    </script>
    <script async src="//www.instagram.com/embed.js"></script>
  </body>
</html>
