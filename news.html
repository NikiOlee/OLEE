<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="OLEELogoNews.png" type="image/x-icon" />
    <title>Sve OLEE Vesti</title>
    <style>
      body {
        font-family: sans-serif;
        background: #ffbf00;
        padding: 20px;
        margin: 0;
      }

      .card {
        background: white;
        padding: 15px;
        border-radius: 10px;
        margin: 0 auto 15px auto;
        border-left: 5px solid #333;
        box-sizing: border-box;
        width: 100%;
        max-width: 100%;
      }

      h2 {
        margin: 5px 0;
        color: #ffbf00;
      }
      .instagram-media {
        max-width: 550px !important;
        width: 100% !important;
        min-width: 250px !important;
        margin: 10px auto !important;
      }

      .video-container iframe {
        width: 100% !important;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <a href="index.html" style="color: black; font-size: 20px">← Nazad</a>
    <h1>Arhiva svih vesti</h1>
    <div id="list">Učitavanje...</div>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        getDocs,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const config = {
        apiKey: "AIzaSyAwkpFwUaI9ODiH39WzEcpnRxODTVRWCbk",
        authDomain: "olee-news.firebaseapp.com",
        projectId: "olee-news",
        storageBucket: "olee-news.firebasestorage.app",
        messagingSenderId: "983990542162",
        appId: "1:983990542162:web:7c506b4a89c51d2c85248b",
        measurementId: "G-DRE0VYDCYT",
      };

      const app = initializeApp(config);
      const db = getFirestore(app);

      async function load() {
        const list = document.getElementById("list");
        try {
          const snap = await getDocs(collection(db, "news"));
          list.innerHTML = "";
          if (snap.empty) {
            list.innerHTML = "Nema vesti.";
            return;
          }

          let items = [];
          snap.forEach((doc) => items.push(doc.data()));
          items.sort((a, b) => b.date - a.date);

          items.forEach((i) => {
            const d = new Date(i.date).toLocaleDateString("sr-RS");
            const div = document.createElement("div");
            div.className = "card";

            const videoContent = i.videoHtml
              ? `<div class="video-container" style="margin-top:10px;">${i.videoHtml}</div>`
              : "";

            div.innerHTML = `
    <div class="date">${d}</div>
    <h2>${i.title}</h2>
    <p>${i.text}</p>
    ${videoContent}
  `;
            list.appendChild(div);
          });
          if (window.instgrm) {
            window.instgrm.Embeds.process();
          }
        } catch (e) {
          list.innerHTML = "Greška.";
        }
      }
      load();
    </script>
    <script async src="//www.instagram.com/embed.js"></script>
  </body>
</html>
