<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sve OLEE Vesti</title>
    <link rel="shortcut icon" href="OLEElogo.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        background-color: white;
      }
      .normal {
        width: 100%;
        position: fixed;
        background-image: linear-gradient(to right, orange, #ffbf00);
        padding: 15px 10px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      }
      .small {
        width: 100%;
        position: fixed;
        background-image: none;
        padding: 15px 10px;
        color: transparent;
      }
      .main {
        background-color: rgb(230, 230, 230);
        max-width: 800px;
        border-radius: 20px;
        padding: 23px 30px 30px 30px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      }
      .link-back {
        color: #000000;
        font-weight: bold;
        text-decoration: none;
        margin-bottom: 20px;
        background-color: #ffbf00;
        padding: 10px;
        border-radius: 25px;
        border: 2px grey solid;
      }

      /* Карточки новостей */
      .card {
        background: #ffffff;
        border: 1px solid #e5e5e5;
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 20px;
        text-align: left;
      }
      .date {
        display: inline-block;
        font-size: 13px;
        font-weight: bold;
        color: #d97706;
        background: #ffecd1;
        padding: 4px 12px;
        border-radius: 12px;
        margin-bottom: 12px;
      }
      .card h2 {
        margin: 0 0 10px 0;
        color: #000000;
        font-size: 22px;
        font-weight: 800;
      }
      .card p {
        margin: 0;
        color: #666666;
        font-size: 16px;
        line-height: 1.5;
      }
      .instagram-media {
        max-width: 100%;
        width: 100%;
        margin: 16px auto 0 auto;
        border-radius: 12px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- Летающие логотипы -->
    <div class="parallax-bg">
      <img
        src="OLEElogo.png"
        class="flying-logo"
        style="top: 20%; left: 0%; transform: rotateZ(30deg)"
        data-speed="0.1"
        data-rotation="30"
      />
      <img
        src="OLEElogo.png"
        class="flying-logo"
        style="top: 40%; right: 5%; transform: rotateZ(80deg)"
        data-speed="0.15"
        data-rotation="80"
      />
      <img
        src="OLEElogo.png"
        class="flying-logo"
        style="top: 60%; left: 0%; transform: rotateZ(-50deg)"
        data-speed="0.1"
        data-rotation="-50"
      />
      <img
        src="OLEElogo.png"
        class="flying-logo"
        style="top: 80%; right: 2%; transform: rotateZ(0deg)"
        data-speed="0.15"
        data-rotation="0"
      />
      <img
        src="OLEElogo.png"
        class="flying-logo"
        style="top: 100%; left: 0%; transform: rotateZ(180deg)"
        data-speed="0.1"
        data-rotation="180"
      />
      <img
        src="OLEElogo.png"
        class="flying-logo"
        style="top: 120%; right: 5%; transform: rotateZ(10deg)"
        data-speed="0.15"
        data-rotation="10"
      />
    </div>

    <!-- Шапка -->
    <header class="normal">
      <h1>OLEE Vesti</h1>
      <a href="index.html">
        <img class="OLEElogo normalLogo" src="OLEElogo.png" alt="OLEE logo" />
      </a>
    </header>

    <!-- Основной контент -->
    <div class="parent">
      <div class="main">
        <a href="index.html" class="link-back">← Nazad na glavnu</a>
        <div id="list">Učitavanje...</div>
      </div>
    </div>

    <!-- Подвал -->
    <footer>
      © <span id="year">2026</span> OLEE – Informativna stranica. Ova stranica
      nije zvanični sajt sportskog kluba OLEE.
    </footer>

    <!-- Основной скрипт сайта -->
    <script src="script.js"></script>

    <!-- Коррекция заголовка h1 при скролле -->
    <script>
      const headerTitle = document.querySelector("header h1");

      if (headerTitle) {
        window.addEventListener("scroll", () => {
          if (window.scrollY > 10) {
            headerTitle.textContent = "";
          } else {
            headerTitle.textContent = "OLEE Vesti";
          }
        });
      }
    </script>

    <!-- Загрузка новостей из Firebase -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        getDocs,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const config = {
        apiKey: "AIzaSyAwkpFwUaI9ODiH39WzEcpnRxODTVRWCbk",
        authDomain: "olee-news.firebaseapp.com",
        projectId: "olee-news",
        storageBucket: "olee-news.firebasestorage.app",
        messagingSenderId: "983990542162",
        appId: "1:983990542162:web:7c506b4a89c51d2c85248b",
        measurementId: "G-DRE0VYDCYT",
      };

      const app = initializeApp(config);
      const db = getFirestore(app);

      function waitForInstagram() {
        return new Promise((resolve) => {
          if (window.instgrm) return resolve();
          const interval = setInterval(() => {
            if (window.instgrm) {
              clearInterval(interval);
              resolve();
            }
          }, 100);
        });
      }

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach(async (entry) => {
            if (!entry.isIntersecting) return;

            const placeholder = entry.target;
            const html = placeholder.dataset.video;

            placeholder.innerHTML = html;
            await waitForInstagram();
            window.instgrm.Embeds.process(placeholder);

            observer.unobserve(placeholder);
          });
        },
        { rootMargin: "200px" },
      );

      async function load() {
        const list = document.getElementById("list");
        try {
          const snap = await getDocs(collection(db, "news"));
          list.innerHTML = "";
          if (snap.empty) {
            list.innerHTML = "Nema vesti.";
            return;
          }

          let items = [];
          snap.forEach((doc) => items.push(doc.data()));

          const parseMyDate = (dateStr) => {
            if (!dateStr || typeof dateStr !== "string") return 0;
            const parts = dateStr.split(" ");
            return new Date(parts[2], parts[1] - 1, parts[0]).getTime();
          };

          items.sort((a, b) => parseMyDate(b.date) - parseMyDate(a.date));

          items.forEach((i) => {
            const div = document.createElement("div");
            div.className = "card";

            let videoContent = "";
            if (i.videoHtml) {
              videoContent = `<div class="video-container" style="margin-top:12px;" data-video="${encodeURIComponent(i.videoHtml)}"></div>`;
            }

            div.innerHTML = `<div class="date">${i.date}</div><h2>${i.title}</h2><p>${i.text}</p>${videoContent}`;
            list.appendChild(div);

            if (i.videoHtml) {
              const placeholder = div.querySelector(
                ".video-container[data-video]",
              );
              placeholder.dataset.video = decodeURIComponent(
                placeholder.dataset.video,
              );
              observer.observe(placeholder);
            }
          });
        } catch (e) {
          list.innerHTML = "Greška pri učitavanju vesti.";
          console.error(e);
        }
      }

      load();
    </script>
    <script async src="//www.instagram.com/embed.js"></script>
  </body>
</html>
